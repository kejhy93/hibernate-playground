spring.application.name=hibernate-test

## DB
spring.datasource.url=jdbc:postgresql://localhost:5432/hibernate_test
spring.datasource.username=postgres
spring.datasource.password=postgres

## JPA - schema is owned by Flyway, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate

## Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

## Open Session In View is on by default in Spring Boot. It keeps the persistence context
## open during web rendering, which hides LazyInitializationException and N+1 problems.
## Turned off so lazy-loading mistakes surface instead of silently running extra queries.
spring.jpa.open-in-view=false

## See what Hibernate does
# Log SQL statements (formatted) and their bind parameter values
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
# Adds "/* comment */" to generated SQL showing where it came from (e.g. the JPQL query)
spring.jpa.properties.hibernate.use_sql_comments=true
# Per-session summary: number of JDBC statements, flushes, batches, time spent
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.session.metrics=DEBUG

## JDBC batching: groups INSERT/UPDATE statements into batches of up to 20.
## Works with SEQUENCE ids; IDENTITY ids disable insert batching.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
